name: Windows Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/NovaBrowser/NovaBrowser.csproj
      - name: Publish self-contained x64
        run: dotnet publish src/NovaBrowser/NovaBrowser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-Windows-x64
          path: dist/
          if-no-files-found: error
